<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Career Cockpit</title>
<style>
html,body{margin:0;min-height:100%;background:#091018;color:#edf3f8;font-family:Inter,Segoe UI,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.card{background:#111b25;border:1px solid #263749;border-radius:16px;padding:24px;max-width:520px;margin:20px}.muted{color:#9bafc1}
</style>
</head>
<body>
<div class="loading"><div class="card"><strong>Career Cockpit</strong><div class="muted" id="status">Loading secure dashboard…</div></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const response=await fetch('https://raw.githubusercontent.com/jakkie-koekemoer/career-cockpit/ee24c91707158bdc210cd68e82f67be4e81334e7/index.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Could not load dashboard source ('+response.status+')');
    let html=await response.text();
    html=html.replaceAll('https://qjywkkxqvseoxzngth.supabase.co','https://qjywkkxqkqvseoxzngth.supabase.co');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.textContent='Could not load the Career Cockpit. '+err.message;
  }
})();
</script>
</body>
</html>
